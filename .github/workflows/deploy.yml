name: Deploy to Cloudflare

# Deploys the dashboard to coordinator.englandbb.co.uk on every push to the
# working branch. Run it by hand from the Actions tab with "Run workflow".
on:
  push:
    branches:
      - claude/blood-bowl-coordinator-app-eiqhpk
  workflow_dispatch:

# Never let two deploys race; the newest push wins.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Kept separate from the deploy so a build failure is obvious in the log.
      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
